# Builds the driver app APK on GitHub's computers whenever code is pushed to main (or when you press
# "Run workflow" on the Actions tab). The APK appears under Releases and on the run's page.
#
# Needs, under Settings → Secrets and variables → Actions:
#   Variables: AVERTO_API_URL        the website address, e.g. https://averto.in
#   Secrets:   KEYSTORE_BASE64       the signing key file, base64-encoded
#              KEYSTORE_PASSWORD     its password
#              KEY_ALIAS             the key's alias inside it
#              KEY_PASSWORD          the key's password (often the same as KEYSTORE_PASSWORD)
name: Build driver APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # to publish the APK as a release

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AVERTO_API_URL: ${{ vars.AVERTO_API_URL }}
      # Every build gets a higher number, so a new APK installs over the old one
      AVERTO_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Check settings
        env:
          HAS_KEY: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          if [ -z "$AVERTO_API_URL" ]; then
            echo "::error::Set the AVERTO_API_URL variable (Settings → Secrets and variables → Actions → Variables)."
            exit 1
          fi
          if [ "$HAS_KEY" != "true" ]; then
            echo "::error::Add the KEYSTORE_BASE64 secret, otherwise updates can't install over the app."
            exit 1
          fi

      - name: Install
        run: npm ci

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/averto-driver.keystore"
          echo "AVERTO_KEYSTORE_FILE=$RUNNER_TEMP/averto-driver.keystore" >> "$GITHUB_ENV"

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: android
        env:
          AVERTO_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          AVERTO_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          AVERTO_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "averto-driver-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: averto-driver-${{ github.run_number }}
          path: averto-driver-${{ github.run_number }}.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: driver-${{ github.run_number }}
          name: Driver app build ${{ github.run_number }}
          body: Download the APK below and send it to the drivers on WhatsApp. It installs over the previous version.
          files: averto-driver-${{ github.run_number }}.apk
